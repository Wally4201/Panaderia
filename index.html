<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panadería Don Chuy | Inicio</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="login-brand">
        <img src="IMG/Logo.png" alt="Logo Panadería Don Chuy" class="login-logo">
        <h1>Panadería Don Chuy</h1>
        <p>Sistema web de inventario</p>
      </div>

      <form id="loginForm" class="login-form">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Ingresa tu usuario">

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingresa tu contraseña">

        <label for="rol">Rol</label>
        <select id="rol">
          <option value="">Selecciona un rol</option>
          <option value="admin">Administrador</option>
          <option value="almacenista">Almacenista</option>
          <option value="cliente">Cliente</option>
        </select>

        <button type="submit">Entrar</button>
      </form>

      <p id="mensaje" class="mensaje"></p>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
